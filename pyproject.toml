[project]
name = "apcopilot"
version = "0.1.0"
description = "Multi-agent invoice processing automation for accounts payable"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pdfplumber>=0.11.0",
    "structlog>=24.4.0",
    "python-dateutil>=2.9.0",
    "rapidfuzz>=3.10.0",
    "pyyaml>=6.0.2",
    "defusedxml>=0.7.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "fpdf2>=2.8.0",
]

[project.scripts]
apcopilot = "apcopilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apcopilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["live: hits the real LLM API (deselected by default)"]

[tool.mypy]
python_version = "3.12"
packages = ["apcopilot"]
mypy_path = "src"
ignore_missing_imports = true
